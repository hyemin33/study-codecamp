<!DOCTYPE html>
<html lang="en">
  <head>
    <title>promise-all</title>
    <script>
      const startPromise = async () => {
        console.time("개별 Promise ");
        const result = await new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("성공");
          }, 2000);
        });
        const result2 = await new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("성공");
          }, 3000);
        });
        const result3 = await new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("성공");
          }, 1000);
        });

        console.timeEnd("개별 Promise ");
      };

      // promise를 동시에
      const startPromiseAll = async () => {
        //await Promise.all([promise, promise, promise]);

        await Promise.all([
          new Promise((resolve, reject) => {
            setTimeout(() => {
              resolve("성공");
            }, 2000);
          }),

          new Promise((resolve, reject) => {
            setTimeout(() => {
              resolve("성공");
            }, 3000);
          }),
          new Promise((resolve, reject) => {
            setTimeout(() => {
              resolve("성공");
            }, 1000);
          }),
        ]);
      };
    </script>
  </head>
  <body>
    <button onClick="startPromise()">Promise 연습하기</button>
    <button onClick="startPromiseAll()">Promise.all 연습하기</button>
  </body>
</html>
