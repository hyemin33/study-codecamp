<!DOCTYPE html>
<html lang="en">
  <head>
    <title>mecro-micro-queue</title>
    <script>
      const onClickLoop = () => {
        console.log("시작");

        //비동기작업(태스크큐에 들어감)
        setTimeout(() => {
          new Promise((resolve) => resolve("철수")).then(() => {
            console.log("저는 Promise setTimeout 안에서 실행됩니다.");
          });

          console.log("저는 setTimeout!! 매크로큐!! 0초 뒤에  실행됩니다.");
        }, 0);

        //비동기작업(마이크로큐에 들어감)
        new Promise((resolve) => resolve("철수")).then(() => {
          console.log("저는 Promise(1) 마이크로큐! 0초 뒤에 실행됩니다");
        });

        //비동기작업(태스크큐에 들어감)
        setInterval(() => {
          console.log("저는 setInterval!! 매크로큐!! 0초 뒤에  실행됩니다.");
        }, 0);

        let sum = 0;
        for (let i = 0; i < 900000000; i++) {
          sum += 1;
        }

        //비동기작업(마이크로큐에 들어감)
        new Promise((resolve) => resolve("철수")).then(() => {
          console.log("저는 Promise(2) 마이크로큐! 0초 뒤에 실행됩니다");
        });

        console.log("끝");
      };

      // 순서
      // 시작!!
      // 끝!!
      // Promise(1)
      // Promise(2)
      // setTimeout
      // Promise (setTimeout 안에 있는)
      // setInterval
    </script>
  </head>
  <body>
    <button onClick="onClickLoop()">시작하기</button>
  </body>
</html>
