<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Promise</title>
    <script>
      const onClickThen = () => {
        new Promise((resolve, reject) => {
          // 시간이 걸리는 작업(ex. API 보내기 등)

          setTimeout(() => {
            try {
              const res = "철수";
              resolve(res); // 성공하면 실행
            } catch (error) {
              reject("에러가 발생했어요"); // 실패하면 이거 실행
            }
          }, 2000);
        }).then((res) => {
          console.log(res); // 철수
        });
      };
      const onClickAwait = async () => {
        const result = await new Promise((resolve, reject) => {
          // 시간이 걸리는 작업(ex. API 보내기 등)

          setTimeout(() => {
            try {
              const res = "철수";
              resolve(res); // 성공하면 실행
            } catch (error) {
              reject("에러가 발생했어요"); // 실패하면 이거 실행
            }
          }, 2000);
        }).then((res) => {
          console.log(res);
        });
        console.log(result); // 철수
      };
    </script>
  </head>
  <body>
    <button onClick="onClickThen()">Promise 실행하기(.then)</button>
    <button onClick="onClickAwait()">Promise 실행하기(.await)</button>
  </body>
</html>
